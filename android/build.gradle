// Root android/build.gradle — merged with extension-system requirements.
// Your original file with three additions, each marked with [ext].

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.1"
        classpath "com.google.gms:google-services:4.4.4"
        // [ext] Kotlin support — required to compile the .kt files.
        // 2.1.20 matches the kotlin-stdlib that kotlinx-serialization and
        // coroutines pull in transitively (1.9.x cannot read 2.1 metadata).
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
        // [ext] kotlinx-serialization plugin — must match the Kotlin version
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.1.20"
    }
}
apply from: "variables.gradle"
allprojects {
    repositories {
        google()
        mavenCentral()
        // [ext] JitPack — hosts the Injekt dependency-injection library
        maven { url 'https://jitpack.io' }
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
